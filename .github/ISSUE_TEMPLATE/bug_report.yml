name: Bug report
description: Something renders wrong, fails to build, or breaks
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please keep it reproducible.
  - type: textarea
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
      placeholder: The aurora renders upside down after...
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to reproduce
      description: Minimal Astro snippet, component props, or a repo link.
      render: astro
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: astro-dither version, Astro version, browser, OS, package manager.
      placeholder: astro-dither 0.1.0, astro 7.4, Edge 142, Windows 11, pnpm
    validations:
      required: true
  - type: textarea
    attributes:
      label: Browser console
      description: Any warnings or WebGL errors in dev tools.
      render: shell
    validations:
      required: false

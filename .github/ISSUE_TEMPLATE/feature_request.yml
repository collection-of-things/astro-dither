name: Feature request
description: A new effect, component, prop, or CLI improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What do you want?
      description: The effect, component, prop or CLI behaviour you are missing.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What for?
      description: The page or design you are trying to build with it.
    validations:
      required: false
